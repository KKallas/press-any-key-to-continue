<meta charset="utf-8">
<title>Mobile Unit 7</title>
<meta name="description" content="Press Any Key to Continue: a monitor rack in a broadcast truck, watching a rainy city through a drone and its street cameras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Layout: a monitor rack from an outside-broadcast truck. One big CRT
     carries the live feed (its on-screen display sits on the picture, being
     part of the camera); three small ones down the side carry the city map
     and two spare inputs. */
  :root {
    --feed-black: #030405;
    --osd: #e9efe9;
    --osd-dim: rgba(233, 239, 233, 0.55);
    --rec: #ff2a2a;
    --panel: rgba(3, 4, 5, 0.62);
    --hud: #8dffa8;
    --hud-dim: rgba(141, 255, 168, 0.62);
    --hud-faint: rgba(141, 255, 168, 0.35);
    --font-osd: "VT323", "Courier New", ui-monospace, monospace;
    --rack: #15171a;
    --rack-hi: #2a2d31;
    --bezel: #0d0e10;
    --plate: #b9b2a0;
    --plate-ink: #1a1a18;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #050607;
    color: var(--osd);
    font-family: var(--font-osd);
    overflow: hidden;
  }

  /* ---- The rack ---- */
  .rack {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 22px 1fr 22px;
    background: #050607;
  }
  .rail {
    background:
      radial-gradient(circle at 50% 50%, #030303 0 3px, transparent 3.5px) 0 0 / 22px 28px,
      linear-gradient(90deg, #1b1d20, #2c2f33 45%, #16181a);
    border-inline: 1px solid #000;
  }
  .bay {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(180px, 22vw, 330px);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "plate plate" "main side" "panel panel";
    gap: 10px;
    padding: 10px;
    background: linear-gradient(180deg, var(--rack-hi), var(--rack) 30%, #101214);
  }
  .top-plate {
    grid-area: plate;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    letter-spacing: 0.18em;
    color: #8c8f93;
  }
  .top-plate .name { color: #c9c3b2; }
  .tallies { display: flex; gap: 10px; align-items: center; }
  .tally { width: 10px; height: 10px; border-radius: 50%; background: #2a0d0d; box-shadow: inset 0 0 2px #000; }
  .tally.on { background: #ff2a2a; box-shadow: 0 0 8px #ff2a2a, inset 0 0 2px #600; }
  .tally.green.on { background: #4dff7a; box-shadow: 0 0 8px #4dff7a; }

  .crt {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 6px;
    padding: 12px 12px 8px;
    background: linear-gradient(160deg, #1e2023, var(--bezel) 60%);
    border-radius: 6px;
    box-shadow: inset 0 1px 0 #34373b, inset 0 -2px 6px #000, 0 2px 8px #000;
  }
  .crt.main { grid-area: main; }
  .side { grid-area: side; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; min-height: 0; }
  .screen {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--feed-black);
    border-radius: 18px / 22px;
    box-shadow: 0 0 0 2px #050505, 0 0 0 5px #1a1b1d;
  }
  .crt.small .screen { border-radius: 14px / 16px; }
  /* The tube: a bulge of glass with a reflection, and the dark round the edge. */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background:
      radial-gradient(120% 90% at 30% 18%, rgba(255, 255, 255, 0.07), transparent 42%),
      radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, 0.55) 100%);
    box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.9);
    z-index: 3;
  }
  .crt.small .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 3px);
    z-index: 2;
  }
  .label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    letter-spacing: 0.14em;
  }
  .label > span { white-space: nowrap; overflow: hidden; }
  .label .tag { background: var(--plate); color: var(--plate-ink); padding: 0 7px; border-radius: 2px; }
  .label .knobs { display: flex; gap: 7px; }
  .knob { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5a5d61, #111 70%); box-shadow: 0 1px 1px #000; }

  .panel {
    grid-area: panel;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 6px 10px;
    background: linear-gradient(180deg, #1b1d20, #0f1012);
    border-radius: 4px;
    box-shadow: inset 0 1px 0 #2e3135;
  }

  #feed {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: var(--feed-black);
  }
  .small canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .osd {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    font-size: clamp(18px, 2.4vw, 28px);
    letter-spacing: 0.06em;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 1);
  }
  .osd-top, .osd-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .osd-bottom { align-items: flex-end; }
  .rec { display: inline-flex; align-items: center; gap: 0.4em; }
  .rec-dot {
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: var(--rec);
    box-shadow: 0 0 8px var(--rec);
  }
  .rec-dot.off { opacity: 0; }
  .clock { font-variant-numeric: tabular-nums; text-align: right; }
  .dim { color: var(--osd-dim); }
  .controls {
    pointer-events: auto;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 20px;
  }
  .controls button {
    font: inherit;
    font-size: 0.8em;
    letter-spacing: 0.08em;
    color: var(--osd-dim);
    background: transparent;
    border: 1px solid rgba(233, 239, 233, 0.25);
    padding: 2px 10px;
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] { color: var(--osd); border-color: var(--osd); }
  .controls button:focus-visible { outline: 2px solid var(--osd); outline-offset: 2px; }
  .stats { font-size: 0.8em; font-variant-numeric: tabular-nums; }
  /* Drone mode: the whole display goes phosphor green. */
  body.mode-drone { --osd: var(--hud); --osd-dim: var(--hud-dim); }

  /* In drone mode the symbology is drawn into the video itself (see hud.js);
     only the controls and the hint stay on top as page elements. */
  body.mode-drone .cam-only { visibility: hidden; }
  .hint { font-size: 0.72em; text-align: center; }

  /* Grade tuning: plain page controls on top of the picture, not part of it. */
  .tune {
    position: fixed;
    right: 16px;
    bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 56px);
    width: min(340px, calc(100% - 32px));
    padding: 10px 12px 12px;
    background: rgba(3, 4, 5, 0.86);
    border: 1px solid rgba(233, 239, 233, 0.25);
    color: var(--osd);
    font-family: var(--font-osd);
    font-size: 19px;
    letter-spacing: 0.05em;
    z-index: 5;
  }
  .tune-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .tune-actions { display: flex; gap: 6px; }
  .tune button {
    font: inherit;
    font-size: 16px;
    color: var(--osd-dim);
    background: transparent;
    border: 1px solid rgba(233, 239, 233, 0.25);
    padding: 0 8px;
    cursor: pointer;
  }
  .tune button:focus-visible, .tune input:focus-visible { outline: 2px solid var(--osd); outline-offset: 2px; }
  .tune-row { display: grid; grid-template-columns: 7.5em 1fr 3em; gap: 8px; align-items: center; }
  .tune-row label { color: var(--osd-dim); white-space: nowrap; }
  .tune-row output { text-align: right; font-variant-numeric: tabular-nums; }
  .tune-row input { width: 100%; min-width: 0; accent-color: var(--osd); }
  .tune textarea {
    width: 100%;
    margin-top: 8px;
    height: 7.5em;
    font: 14px ui-monospace, "Courier New", monospace;
    background: #000;
    color: var(--osd);
    border: 1px solid rgba(233, 239, 233, 0.25);
    resize: none;
  }

  /* The hack: a terminal session typed over the snow while the feed connects. */
  #hack {
    position: absolute;
    z-index: 4;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, calc(100% - 32px));
    padding: 14px 18px;
    background: rgba(3, 4, 5, 0.82);
    color: var(--osd);
    font-size: clamp(18px, 2vw, 24px);
    white-space: pre-wrap;
    pointer-events: none;
  }

  /* Phones: the side monitors go in a row under the main one. */
  @media (max-width: 760px), (max-aspect-ratio: 4/5) {
    .rack { grid-template-columns: 8px 1fr 8px; }
    .bay {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      grid-template-areas: "plate" "main" "side" "panel";
      padding: 8px;
      gap: 8px;
    }
    .side { grid-template-rows: none; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 26vw; min-height: 110px; }
    .top-plate { font-size: 13px; }
    .label { font-size: 12px; }
    .crt { padding: 7px 7px 5px; }
  }

  /* Minigames: a panel over the main screen, in the terminal's phosphor. */
  .mg {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: grid;
    place-items: center;
    background: rgba(1, 3, 2, 0.55);
  }
  .mg-box {
    width: min(460px, calc(100% - 40px));
    padding: 16px 20px 18px;
    background: radial-gradient(120% 100% at 50% 0%, #06180d, #010604 75%);
    border-radius: 8px;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 0 2px #0a0c0b, 0 0 30px rgba(60,255,120,0.06);
    color: #7dff9a;
    font-family: var(--font-osd);
    text-shadow: 0 0 6px rgba(60,255,120,0.4);
  }
  /* A bigger window for the break-in games, which want room to read. */
  .mg-large .mg-box { width: min(680px, calc(100% - 32px)); padding: 22px 28px 24px; }
  .mg-large .mg-body { min-height: 260px; }
  /* Slim-jim: a tall window gap with the tool sliding down it. */
  .sj-track { position: relative; width: 84px; height: 240px; border: 1px solid rgba(125,255,154,0.35); background: linear-gradient(90deg, rgba(125,255,154,0.03), rgba(125,255,154,0.08), rgba(125,255,154,0.03)); overflow: hidden; }
  .sj-tool { position: absolute; left: -8px; right: -8px; height: 4px; top: 50%; background: #eaffef; box-shadow: 0 0 6px #7dff9a; transition: top 0.05s linear; }
  .mg-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; letter-spacing: 0.1em; margin-bottom: 14px; }
  .mg-sub { font-size: 14px; opacity: 0.6; }
  .mg-body { min-height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .mg-foot { margin-top: 12px; text-align: center; font-size: 18px; letter-spacing: 0.12em; min-height: 22px; }
  .mg-line { font-size: 15px; opacity: 0.7; }
  .mg-coin { font-size: 56px; width: 80px; height: 80px; line-height: 80px; text-align: center; border: 2px solid #7dff9a; border-radius: 50%; }
  .mg-bar { position: relative; width: 100%; height: 34px; border: 1px solid rgba(125,255,154,0.4); background: rgba(125,255,154,0.05); overflow: hidden; }
  .mg-notch { position: absolute; top: 0; bottom: 0; background: rgba(125,255,154,0.22); }
  .mg-cursor { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #eaffef; box-shadow: 0 0 8px #7dff9a; }
  .mg-pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
  .mg-pad { aspect-ratio: 1; display: grid; place-items: center; font-size: 26px; border: 1px solid rgba(125,255,154,0.4); background: rgba(125,255,154,0.05); cursor: pointer; user-select: none; }
  .mg-pad.lit { background: #7dff9a; color: #021; box-shadow: 0 0 18px #7dff9a; }

  /* Boot cover: opaque from the very first paint so the rack chrome is never
     seen bare. The login terminal sits above it; it stays until the first
     real frame has rendered, then fades to reveal the feed. */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 18;
    display: grid;
    place-items: center;
    background: #010202;
    color: #6dff8e;
    font-family: var(--font-osd);
    font-size: clamp(16px, 2.2vw, 22px);
    letter-spacing: 0.3em;
    text-shadow: 0 0 6px rgba(60,255,120,0.45);
    transition: opacity 0.6s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .dots::after { content: ""; animation: boot-dots 1.2s steps(4, end) infinite; }
  @keyframes boot-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* The login front page: a single CRT over black. */
  .login {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: #010202;
    padding: 16px;
  }
  .login-crt {
    width: min(680px, 100%);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 22px 22px 14px;
    background: radial-gradient(120% 100% at 50% 0%, #04140a, #010604 70%);
    border-radius: 10px;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 0 0 2px #0a0c0b, 0 0 40px rgba(60,255,120,0.05);
    color: #6dff8e;
    font-family: var(--font-osd);
    font-size: clamp(16px, 2.3vw, 22px);
    text-shadow: 0 0 6px rgba(60,255,120,0.45);
  }
  .login-crt::selection, .login-crt *::selection { background: #6dff8e; color: #011; }
  #login-log { margin: 0; white-space: pre-wrap; word-break: break-word; overflow-y: auto; }
  .login-line { display: flex; align-items: center; gap: 8px; }
  .login-caret { opacity: 0.8; }
  #login-in {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: inherit;
    font: inherit;
    text-shadow: inherit;
    caret-color: #6dff8e;
  }
  .login-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 0.7em; opacity: 0.65; margin-top: 6px; }
  .login-foot a { color: inherit; }

  .err {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    font-size: 26px;
    background: var(--feed-black);
  }
</style>

<div id="boot">MOBILE UNIT 7 · CONNECTING<span class="dots"></span></div>

<div class="rack">
  <div class="rail" aria-hidden="true"></div>
  <div class="bay">
    <div class="top-plate">
      <span class="name">PRESS ANY KEY TO CONTINUE · MOBILE UNIT 7</span>
      <span id="online" class="dim"></span>
      <span class="tallies" aria-hidden="true"><span class="tally on" id="tally-rec"></span><span class="tally green on"></span><span class="tally"></span></span>
    </div>

    <div class="crt main">
      <div class="screen" id="main-screen">
        <canvas id="feed" aria-label="Drone and surveillance camera views of a rainy street at night"></canvas>
        <div class="osd" aria-live="off">
          <div class="osd-top cam-only">
            <div>
              <div class="rec"><span class="rec-dot" id="rec-dot"></span><span>REC</span></div>
              <div id="cam-name">UAV-2</div>
              <div class="dim" id="cam-desc">EO NIGHT · WIDE</div>
            </div>
            <div class="clock">
              <div id="date">31.12.1999</div>
              <div id="time">23:59:00</div>
            </div>
          </div>
          <div></div>
          <div class="hint dim" id="hint"></div>
          <div></div>
        </div>
        <div id="hack" hidden></div>
      </div>
      <div class="label"><span class="tag">PGM</span><span id="pgm-name">UAV-2</span><span class="knobs" aria-hidden="true"><span class="knob"></span><span class="knob"></span><span class="knob"></span></span></div>
    </div>

    <div class="side">
      <div class="crt small">
        <div class="screen"><canvas id="map" aria-label="City map with the next link: where and when"></canvas></div>
        <div class="label"><span class="tag">MAP</span><span id="map-label">LINK</span></div>
      </div>
      <div class="crt small">
        <div class="screen"><canvas id="aux1" aria-label="Action selector: what you can do here"></canvas></div>
        <div class="label"><span class="tag">ACT</span><span id="aux1-label" class="dim">STANDBY</span></div>
      </div>
      <div class="crt small">
        <div class="screen"><canvas id="aux2" aria-label="Inventory: what you are carrying"></canvas></div>
        <div class="label"><span class="tag">KIT</span><span id="aux2-label" class="dim">INVENTORY</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="controls" role="toolbar" aria-label="Render quality">
        <button type="button" id="q-low" data-tier="low" aria-pressed="false">LOW</button>
        <button type="button" id="q-mid" data-tier="mid" aria-pressed="false">MID</button>
        <button type="button" id="q-high" data-tier="high" aria-pressed="false">HIGH</button>
        <button type="button" id="q-auto" data-tier="auto" aria-pressed="true">AUTO</button>
        <button type="button" id="grade" aria-pressed="true">GRADE</button>
        <button type="button" id="tune" aria-expanded="false" aria-controls="tune-panel">TUNE</button>
      </div>
      <div class="stats dim" id="stats">-- FPS</div>
    </div>
  </div>
  <div class="rail" aria-hidden="true"></div>
</div>

<div id="tune-panel" class="tune" hidden role="group" aria-label="Grade settings">
  <div class="tune-head">
    <span>GRADE</span>
    <span class="tune-actions">
      <button type="button" id="tune-copy">COPY</button>
      <button type="button" id="tune-reset">RESET</button>
      <button type="button" id="tune-close" aria-label="Close">×</button>
    </span>
  </div>
  <div id="tune-rows"></div>
  <textarea id="tune-out" readonly hidden aria-label="Grade settings to copy"></textarea>
</div>

<div id="hack" hidden></div>

<div class="err" id="err" hidden>NO SIGNAL<br><span class="dim" id="err-detail"></span></div>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }

</script>
