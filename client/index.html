<title>CAM 07 Block 01</title>
<meta name="description" content="Press Any Key to Continue: engine core. One block in the rain, seen through one surveillance camera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Layout: one full-screen camera feed; the on-screen display is part of the camera, so it sits on the image. */
  :root {
    --feed-black: #030405;
    --osd: #e9efe9;
    --osd-dim: rgba(233, 239, 233, 0.55);
    --rec: #ff2a2a;
    --panel: rgba(3, 4, 5, 0.62);
    --hud: #8dffa8;
    --hud-dim: rgba(141, 255, 168, 0.62);
    --hud-faint: rgba(141, 255, 168, 0.35);
    --font-osd: "VT323", "Courier New", ui-monospace, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--feed-black);
    color: var(--osd);
    font-family: var(--font-osd);
    overflow: hidden;
  }
  #feed {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: var(--feed-black);
  }
  .osd {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    font-size: clamp(18px, 2.4vw, 28px);
    letter-spacing: 0.06em;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 1);
  }
  .osd-top, .osd-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .osd-bottom { align-items: flex-end; }
  .rec { display: inline-flex; align-items: center; gap: 0.4em; }
  .rec-dot {
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: var(--rec);
    box-shadow: 0 0 8px var(--rec);
  }
  .rec-dot.off { opacity: 0; }
  .clock { font-variant-numeric: tabular-nums; text-align: right; }
  .dim { color: var(--osd-dim); }
  .controls {
    pointer-events: auto;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--panel);
    padding: 6px 8px;
  }
  .controls button {
    font: inherit;
    font-size: 0.8em;
    letter-spacing: 0.08em;
    color: var(--osd-dim);
    background: transparent;
    border: 1px solid rgba(233, 239, 233, 0.25);
    padding: 2px 10px;
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] { color: var(--osd); border-color: var(--osd); }
  .controls button:focus-visible { outline: 2px solid var(--osd); outline-offset: 2px; }
  .stats { font-size: 0.8em; font-variant-numeric: tabular-nums; }
  /* Drone mode: the whole display goes phosphor green. */
  body.mode-drone { --osd: var(--hud); --osd-dim: var(--hud-dim); }

  /* Drone symbology: crosshair, corner brackets, telemetry. Shown only in drone mode. */
  .drone-only { display: none; }
  body.mode-drone .drone-only { display: block; }
  body.mode-drone .cam-only { display: none; }
  .reticle {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 120px;
    height: 120px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .reticle::before, .reticle::after {
    content: "";
    position: absolute;
    background: var(--osd);
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }
  .reticle::before { left: 0; right: 0; top: 50%; height: 1px; mask: linear-gradient(90deg, #000 40%, transparent 40%, transparent 60%, #000 60%); -webkit-mask: linear-gradient(90deg, #000 40%, transparent 40%, transparent 60%, #000 60%); }
  .reticle::after { top: 0; bottom: 0; left: 50%; width: 1px; mask: linear-gradient(180deg, #000 40%, transparent 40%, transparent 60%, #000 60%); -webkit-mask: linear-gradient(180deg, #000 40%, transparent 40%, transparent 60%, #000 60%); }
  .frame-brackets {
    position: fixed;
    inset: 12%;
    pointer-events: none;
    border: 1px solid transparent;
    background:
      linear-gradient(var(--osd), var(--osd)) top left / 28px 1px no-repeat,
      linear-gradient(var(--osd), var(--osd)) top left / 1px 28px no-repeat,
      linear-gradient(var(--osd), var(--osd)) top right / 28px 1px no-repeat,
      linear-gradient(var(--osd), var(--osd)) top right / 1px 28px no-repeat,
      linear-gradient(var(--osd), var(--osd)) bottom left / 28px 1px no-repeat,
      linear-gradient(var(--osd), var(--osd)) bottom left / 1px 28px no-repeat,
      linear-gradient(var(--osd), var(--osd)) bottom right / 28px 1px no-repeat,
      linear-gradient(var(--osd), var(--osd)) bottom right / 1px 28px no-repeat;
    opacity: 0.7;
  }
  .telemetry { font-variant-numeric: tabular-nums; line-height: 1.15; white-space: pre; margin-top: 0.3em; }
  .hint { font-size: 0.72em; text-align: center; }

  /* Hackable cameras, marked on the drone feed. */
  #markers { position: fixed; inset: 0; pointer-events: none; }
  .cam-marker {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    font: inherit;
    font-size: clamp(15px, 1.6vw, 20px);
    letter-spacing: 0.06em;
    color: var(--osd);
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-shadow: 0 0 4px rgba(0, 0, 0, 1);
  }
  .cam-marker { font-size: clamp(13px, 1.3vw, 17px); color: var(--hud-dim); }
  .cam-marker .box {
    width: 10px;
    height: 10px;
    border: 1px solid var(--hud-dim);
    transform: rotate(45deg);
  }
  .block-tag {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: clamp(16px, 1.6vw, 22px);
    letter-spacing: 0.2em;
    color: var(--hud-faint);
    text-shadow: 0 0 4px rgba(0, 0, 0, 1);
    white-space: nowrap;
  }
  /* The tracking box: four corners around whatever the drone follows. */
  .track {
    position: absolute;
    transform: translate(-50%, -50%);
    --c: var(--hud);
    background:
      linear-gradient(var(--c), var(--c)) top left / 9px 2px no-repeat,
      linear-gradient(var(--c), var(--c)) top left / 2px 9px no-repeat,
      linear-gradient(var(--c), var(--c)) top right / 9px 2px no-repeat,
      linear-gradient(var(--c), var(--c)) top right / 2px 9px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / 9px 2px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom left / 2px 9px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / 9px 2px no-repeat,
      linear-gradient(var(--c), var(--c)) bottom right / 2px 9px no-repeat;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 1));
  }
  .track-label {
    position: absolute;
    left: calc(100% + 8px);
    top: -4px;
    font-size: clamp(14px, 1.4vw, 19px);
    color: var(--hud);
    white-space: nowrap;
    text-shadow: 0 0 4px rgba(0, 0, 0, 1);
  }

  /* The hack: a terminal session typed over the snow while the feed connects. */
  #hack {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, calc(100% - 32px));
    padding: 14px 18px;
    background: rgba(3, 4, 5, 0.82);
    color: var(--osd);
    font-size: clamp(18px, 2vw, 24px);
    white-space: pre-wrap;
    pointer-events: none;
  }

  .err {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    font-size: 26px;
    background: var(--feed-black);
  }
</style>

<canvas id="feed" aria-label="Drone and surveillance camera views of a rainy street at night"></canvas>

<div class="reticle drone-only" aria-hidden="true"></div>
<div class="frame-brackets drone-only" aria-hidden="true"></div>
<div id="markers" class="drone-only"></div>

<div class="osd" aria-live="off">
  <div class="osd-top">
    <div>
      <div class="rec"><span class="rec-dot" id="rec-dot"></span><span>REC</span></div>
      <div id="cam-name">UAV-2</div>
      <div class="dim" id="cam-desc">EO NIGHT · WIDE</div>
      <div class="telemetry dim drone-only" id="telemetry"></div>
    </div>
    <div class="clock">
      <div id="date">31.12.1999</div>
      <div id="time">23:59:00</div>
    </div>
  </div>
  <div></div>
  <div class="hint dim" id="hint"></div>
  <div class="osd-bottom">
    <div class="controls" role="toolbar" aria-label="Render quality">
      <button type="button" id="q-low" data-tier="low" aria-pressed="false">LOW</button>
      <button type="button" id="q-mid" data-tier="mid" aria-pressed="false">MID</button>
      <button type="button" id="q-high" data-tier="high" aria-pressed="false">HIGH</button>
      <button type="button" id="q-auto" data-tier="auto" aria-pressed="true">AUTO</button>
      <button type="button" id="grade" aria-pressed="true">GRADE</button>
    </div>
    <div class="stats dim" id="stats">-- FPS</div>
  </div>
</div>

<div id="hack" hidden></div>

<div class="err" id="err" hidden>NO SIGNAL<br><span class="dim" id="err-detail"></span></div>

    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

  }
}
</script>
<script type="module" src="src/main.js"></script>
